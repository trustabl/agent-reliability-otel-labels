[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-otel-labels"
version = "0.1.0"
description = "Process-metadata labels for OpenTelemetry agent spans"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["opentelemetry-api>=1.20", "rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://github.com/trustabl/agent-reliability-otel-labels"
Repository = "https://github.com/trustabl/agent-reliability-otel-labels"
Issues = "https://github.com/trustabl/agent-reliability-otel-labels/issues"

[project.optional-dependencies]
dev = ["opentelemetry-sdk>=1.20", "pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability_otel_labels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
